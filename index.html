<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>VK-Bericht</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    button,input,textarea{font:inherit}
    .app{max-width:760px;margin:auto;padding:16px 12px 40px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:26px;margin:0}
    .sub{font-size:12px;color:#6b7280;margin-top:4px}
    .version{font-size:11px;color:#94a3b8;margin-top:2px}
    .plus{width:46px;height:46px;border:0;border-radius:14px;background:#0f172a;color:#fff;font-size:28px;line-height:46px;padding:0;cursor:pointer}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px rgba(15,23,42,.07)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .title{font-weight:800;font-size:17px}
    label{display:block;font-size:12px;font-weight:700;color:#6b7280;margin:11px 0 5px}
    input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#111827;padding:12px 13px;font-size:16px;outline:none}
    textarea{min-height:88px;resize:vertical;line-height:1.4}
    input:focus,textarea:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.14)}
    .list{display:flex;flex-direction:column;gap:8px}
    .list-row{display:grid;grid-template-columns:1fr 42px;gap:8px;align-items:center}
    .contact-row{display:grid;grid-template-columns:1fr 1fr 1fr 42px;gap:8px;align-items:center}
    .remove{width:42px;height:42px;border:0;border-radius:12px;background:#fee2e2;color:#b91c1c;font-size:22px;cursor:pointer}
    .mini-plus{width:42px;height:42px;border:0;border-radius:12px;background:#e8edf3;color:#0f172a;font-size:25px;cursor:pointer}
    .primary,.secondary,.danger{border:0;border-radius:12px;min-height:46px;padding:0 14px;font-weight:800;cursor:pointer}
    .primary{background:#0f172a;color:#fff}
    .secondary{background:#e5e7eb;color:#111827}
    .danger{background:#fee2e2;color:#b91c1c}
    .hidden{display:none!important}
    .reports{display:flex;flex-direction:column;gap:10px}
    .report{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.07)}
    .report-name{font-weight:800;font-size:17px;margin-bottom:4px;word-break:break-word}
    .meta{font-size:12px;color:#6b7280;margin-bottom:10px}
    .report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .empty{text-align:center;color:#6b7280;padding:30px 16px}
    .empty .primary{margin-top:14px}
    .editor-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
    .editor-actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:12px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#f3f4f6 72%,rgba(243,244,246,0));z-index:5}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none;z-index:99;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .hint{font-size:12px;color:#6b7280;margin-top:7px}
    @media(max-width:600px){
      .contact-row{grid-template-columns:1fr 42px}
      .contact-row input{grid-column:1}
      .contact-row .remove{grid-column:2;grid-row:1 / span 3;height:142px}
      .editor-actions,.report-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">

  <section id="homeView">
    <div class="top">
      <div>
        <h1>VK-Bericht</h1>
        <div class="sub">Terminübersicht</div>
        <div class="version">Version 10</div>
      </div>
      <button id="newReportTop" class="plus" type="button" aria-label="Neuen Termin erstellen">+</button>
    </div>

    <div id="reportList" class="reports"></div>

    <div id="emptyState" class="card empty">
      Noch kein Termin vorhanden.
      <br>
      <button id="newReportEmpty" class="primary" type="button">Neuen Termin erstellen</button>
    </div>
  </section>

  <section id="editorView" class="hidden">
    <div class="editor-top">
      <button id="backBtn" class="secondary" type="button">← Übersicht</button>
      <button id="deleteBtn" class="danger" type="button">Termin löschen</button>
    </div>

    <div class="card">
      <div class="section-head"><div class="title">*Termin:*</div></div>
      <textarea id="termin" placeholder="z. B. BMW Werk Irlbach"></textarea>
    </div>

    <div class="card map-section" data-key="lotsenpunkt">
      <div class="section-head"><div class="title">*Lotsenpunkt:*</div></div>
      <label>Google-Maps-Punkt</label>
      <input class="map-url" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…">
      <label>Erreichbarkeit</label>
      <input class="map-reachability" type="text" placeholder="z. B. ab 08:00 Uhr / telefonisch / Funk …">
      <label>Verantwortlicher</label>
      <input class="map-responsible" type="text" placeholder="Name / Funktion / Einheit …">
      <label>Kommentar</label>
      <textarea class="map-comment" placeholder="Zusätzliche Hinweise …"></textarea>
    </div>

    <div class="card map-section" data-key="ausstieg">
      <div class="section-head"><div class="title">*Ausstieg:*</div></div>
      <label>Google-Maps-Punkt</label>
      <input class="map-url" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…">
      <label>Kommentar</label>
      <textarea class="map-comment" placeholder="Zusätzliche Hinweise …"></textarea>
    </div>

    <div class="card">
      <div class="section-head"><div class="title">*Ablauf:*</div></div>
      <textarea id="ablauf" placeholder="Ablauf eintragen …"></textarea>
    </div>

    <div class="card map-section" data-key="abfahrt">
      <div class="section-head"><div class="title">*Abfahrt:*</div></div>
      <label>Google-Maps-Punkt</label>
      <input class="map-url" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…">
      <label>Kommentar</label>
      <textarea class="map-comment" placeholder="Zusätzliche Hinweise …"></textarea>
    </div>

    <div class="card">
      <div class="section-head">
        <div class="title">*Sicherheit:*</div>
        <button id="addSecurity" class="mini-plus" type="button">+</button>
      </div>
      <div id="securityList" class="list"></div>
    </div>

    <div class="card map-section" data-key="evak">
      <div class="section-head"><div class="title">*EVAK:*</div></div>
      <label>Google-Maps-Punkt</label>
      <input class="map-url" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…">
      <label>Kommentar</label>
      <textarea class="map-comment" placeholder="Zusätzliche Hinweise …"></textarea>
    </div>

    <div class="card">
      <div class="section-head">
        <div class="title">*Sonstiges:*</div>
        <button id="addOther" class="mini-plus" type="button">+</button>
      </div>
      <div id="otherList" class="list"></div>
    </div>

    <div class="card">
      <div class="section-head">
        <div class="title">*Ansprechpartner:*</div>
        <button id="addContact" class="mini-plus" type="button">+</button>
      </div>
      <div id="contactList" class="list"></div>
      <div class="hint">Name, Funktion und Telefonnummer werden getrennt erfasst.</div>
    </div>

    <div class="editor-actions">
      <button id="saveBackBtn" class="secondary" type="button">Speichern & Übersicht</button>
      <button id="shareBtn" class="primary" type="button">In App teilen</button>
    </div>
  </section>
</div>

<div id="toast" class="toast">Gespeichert</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "terminplaner_multi_v1";
  var reports = [];
  var currentId = null;
  var saveTimer = null;

  function byId(id){ return document.getElementById(id); }
  function q(selector, root){ return (root || document).querySelector(selector); }
  function qa(selector, root){ return Array.prototype.slice.call((root || document).querySelectorAll(selector)); }

  function uid(){
    return "r_" + String(new Date().getTime()) + "_" + Math.random().toString(36).slice(2,8);
  }

  function blankReport(){
    return {
      id: uid(),
      createdAt: new Date().getTime(),
      updatedAt: new Date().getTime(),
      termin: "",
      lotsenpunkt: {url:"", reachability:"", responsible:"", comment:""},
      ausstieg: {url:"", comment:""},
      ablauf: "",
      abfahrt: {url:"", comment:""},
      sicherheit: [""],
      evak: {url:"", comment:""},
      sonstiges: [""],
      ansprechpartner: [{name:"", funktion:"", phone:""}]
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      reports = Array.isArray(parsed) ? parsed : [];
    }catch(e){
      reports = [];
    }
  }

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(reports)); }catch(e){}
  }

  function escapeHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function reportName(r){
    var parts = String(r && r.termin ? r.termin : "").split(/\r?\n/);
    var i;
    for(i=0;i<parts.length;i++){
      if(parts[i].trim()) return parts[i].trim();
    }
    return "Unbenannter Termin";
  }

  function formatDate(ts){
    try{ return new Date(ts).toLocaleString("de-DE"); }
    catch(e){ return ""; }
  }

  function normalizeReport(r){
    if(!r || typeof r !== "object") return blankReport();
    if(!r.id) r.id = uid();
    if(!r.createdAt) r.createdAt = new Date().getTime();
    if(!r.updatedAt) r.updatedAt = r.createdAt;

    if(!r.lotsenpunkt) r.lotsenpunkt = {};
    if(r.lotsenpunkt.reachability == null) r.lotsenpunkt.reachability = "";
    if(r.lotsenpunkt.responsible == null) r.lotsenpunkt.responsible = "";
    if(r.lotsenpunkt.url == null) r.lotsenpunkt.url = "";
    if(r.lotsenpunkt.comment == null) r.lotsenpunkt.comment = "";

    if(!r.ausstieg) r.ausstieg = {url:"",comment:""};
    if(!r.abfahrt) r.abfahrt = {url:"",comment:""};
    if(!r.evak) r.evak = {url:"",comment:""};
    if(!Array.isArray(r.sicherheit)) r.sicherheit = [""];
    if(!Array.isArray(r.sonstiges)) r.sonstiges = [""];
    if(!Array.isArray(r.ansprechpartner)) r.ansprechpartner = [{name:"",funktion:"",phone:""}];

    r.ansprechpartner.forEach(function(c){
      if(c && c.funktion == null) c.funktion = "";
    });

    return r;
  }

  function renderHome(){
    var list = byId("reportList");
    list.innerHTML = "";

    reports = reports.map(normalizeReport);
    reports.sort(function(a,b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });

    byId("emptyState").className = reports.length ? "card empty hidden" : "card empty";

    reports.forEach(function(r){
      var item = document.createElement("div");
      item.className = "report";
      item.innerHTML =
        '<div class="report-name">' + escapeHtml(reportName(r)) + '</div>' +
        '<div class="meta">Zuletzt geändert: ' + escapeHtml(formatDate(r.updatedAt)) + '</div>' +
        '<div class="report-actions">' +
          '<button class="primary openBtn" type="button">Öffnen</button>' +
          '<button class="secondary shareListBtn" type="button">In App teilen</button>' +
        '</div>';

      q(".openBtn", item).addEventListener("click", function(){ openReport(r.id); });
      q(".shareListBtn", item).addEventListener("click", function(){ shareReport(r); });
      list.appendChild(item);
    });

    persist();
  }

  function newReport(){
    var r = blankReport();
    reports.unshift(r);
    persist();
    openReport(r.id);
  }

  function openReport(id){
    var r = null;
    var i;
    for(i=0;i<reports.length;i++){
      if(reports[i].id === id){ r = normalizeReport(reports[i]); break; }
    }
    if(!r) return;

    currentId = id;
    fillForm(r);
    byId("homeView").classList.add("hidden");
    byId("editorView").classList.remove("hidden");
    window.scrollTo(0,0);
  }

  function showHome(){
    saveCurrent(true);
    currentId = null;
    byId("editorView").classList.add("hidden");
    byId("homeView").classList.remove("hidden");
    renderHome();
    window.scrollTo(0,0);
  }

  function setMap(key, data){
    data = data || {};
    var sec = q('.map-section[data-key="' + key + '"]');
    q(".map-url", sec).value = data.url || "";
    q(".map-comment", sec).value = data.comment || "";

    var reach = q(".map-reachability", sec);
    if(reach) reach.value = data.reachability || "";

    var resp = q(".map-responsible", sec);
    if(resp) resp.value = data.responsible || "";
  }

  function getMap(key){
    var sec = q('.map-section[data-key="' + key + '"]');
    var obj = {
      url: q(".map-url", sec).value.trim(),
      comment: q(".map-comment", sec).value.trim()
    };

    var reach = q(".map-reachability", sec);
    if(reach) obj.reachability = reach.value.trim();

    var resp = q(".map-responsible", sec);
    if(resp) obj.responsible = resp.value.trim();

    return obj;
  }

  function addListRow(containerId, value){
    var row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML =
      '<input class="list-input" type="text" placeholder="Punkt eintragen …" value="' + escapeHtml(value || "") + '">' +
      '<button class="remove" type="button">−</button>';

    q(".remove", row).addEventListener("click", function(){
      row.parentNode.removeChild(row);
      queueSave();
    });
    q(".list-input", row).addEventListener("input", queueSave);
    byId(containerId).appendChild(row);
  }

  function addContactRow(name, funktion, phone){
    var row = document.createElement("div");
    row.className = "contact-row";
    row.innerHTML =
      '<input class="contact-name" type="text" placeholder="Name" value="' + escapeHtml(name || "") + '">' +
      '<input class="contact-function" type="text" placeholder="Funktion" value="' + escapeHtml(funktion || "") + '">' +
      '<input class="contact-phone" type="tel" inputmode="tel" placeholder="Telefonnummer" value="' + escapeHtml(phone || "") + '">' +
      '<button class="remove" type="button">−</button>';

    q(".remove", row).addEventListener("click", function(){
      row.parentNode.removeChild(row);
      queueSave();
    });

    qa("input", row).forEach(function(el){ el.addEventListener("input", queueSave); });
    byId("contactList").appendChild(row);
  }

  function fillForm(r){
    byId("termin").value = r.termin || "";
    byId("ablauf").value = r.ablauf || "";

    setMap("lotsenpunkt", r.lotsenpunkt);
    setMap("ausstieg", r.ausstieg);
    setMap("abfahrt", r.abfahrt);
    setMap("evak", r.evak);

    byId("securityList").innerHTML = "";
    (r.sicherheit.length ? r.sicherheit : [""]).forEach(function(v){ addListRow("securityList", v); });

    byId("otherList").innerHTML = "";
    (r.sonstiges.length ? r.sonstiges : [""]).forEach(function(v){ addListRow("otherList", v); });

    byId("contactList").innerHTML = "";
    (r.ansprechpartner.length ? r.ansprechpartner : [{name:"",funktion:"",phone:""}]).forEach(function(c){
      addContactRow(c.name, c.funktion || "", c.phone);
    });
  }

  function snapshot(){
    return {
      termin: byId("termin").value,
      lotsenpunkt: getMap("lotsenpunkt"),
      ausstieg: getMap("ausstieg"),
      ablauf: byId("ablauf").value,
      abfahrt: getMap("abfahrt"),
      sicherheit: qa("#securityList .list-input").map(function(x){ return x.value.trim(); }),
      evak: getMap("evak"),
      sonstiges: qa("#otherList .list-input").map(function(x){ return x.value.trim(); }),
      ansprechpartner: qa("#contactList .contact-row").map(function(row){
        return {
          name: q(".contact-name", row).value.trim(),
          funktion: q(".contact-function", row).value.trim(),
          phone: q(".contact-phone", row).value.trim()
        };
      })
    };
  }

  function saveCurrent(silent){
    if(!currentId) return;
    var i;
    for(i=0;i<reports.length;i++){
      if(reports[i].id === currentId){
        var s = snapshot();
        var k;
        for(k in s){ if(Object.prototype.hasOwnProperty.call(s,k)) reports[i][k] = s[k]; }
        reports[i].updatedAt = new Date().getTime();
        persist();
        if(!silent) toast("Gespeichert");
        return;
      }
    }
  }

  function queueSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveCurrent(true); }, 250);
  }

  function deleteCurrent(){
    if(!currentId) return;
    var r = null;
    var i;
    for(i=0;i<reports.length;i++){ if(reports[i].id === currentId){ r=reports[i]; break; } }
    if(!r) return;
    if(!window.confirm('"' + reportName(r) + '" wirklich löschen?')) return;

    reports = reports.filter(function(x){ return x.id !== currentId; });
    persist();
    currentId = null;
    byId("editorView").classList.add("hidden");
    byId("homeView").classList.remove("hidden");
    renderHome();
    toast("Termin gelöscht");
  }

  function nonEmptyLines(text){
    return String(text || "")
      .split(/?
/)
      .map(function(x){ return x.trim(); })
      .filter(Boolean);
  }

  function heading(lines,title){
    lines.push("*" + title + ":*");
  }

  function addTextBlock(lines,title,text,bullets){
    var values = nonEmptyLines(text);
    if(!values.length) return;

    heading(lines,title);
    values.forEach(function(v){
      lines.push(bullets ? "- " + v : v);
    });
    lines.push("");
  }

  function addMapBlock(lines,title,obj){
    obj = obj || {};

    var url = String(obj.url || "").trim();
    var reachability = String(obj.reachability || "").trim();
    var responsible = String(obj.responsible || "").trim();
    var comments = nonEmptyLines(obj.comment);

    if(!url && !reachability && !responsible && !comments.length) return;

    heading(lines,title);

    if(url) lines.push("Google Maps: " + url);
    if(reachability) lines.push("Erreichbarkeit: " + reachability);
    if(responsible) lines.push("Verantwortlicher: " + responsible);

    if(comments.length === 1){
      lines.push("Kommentar: " + comments[0]);
    }else if(comments.length > 1){
      lines.push("Kommentar:");
      comments.forEach(function(v){ lines.push("- " + v); });
    }

    lines.push("");
  }

  function addListBlock(lines,title,values){
    var clean = (values || [])
      .map(function(x){ return String(x || "").trim(); })
      .filter(Boolean);

    if(!clean.length) return;

    heading(lines,title);
    clean.forEach(function(x){ lines.push("- " + x); });
    lines.push("");
  }

  function addContactsBlock(lines,contacts){
    var clean = (contacts || []).filter(function(c){
      return String((c && c.name) || "").trim() ||
             String((c && c.funktion) || "").trim() ||
             String((c && c.phone) || "").trim();
    });

    if(!clean.length) return;

    heading(lines,"Ansprechpartner");

    clean.forEach(function(c,idx){
      var name = String(c.name || "").trim();
      var funktion = String(c.funktion || "").trim();
      var phone = String(c.phone || "").trim();

      if(name) lines.push("- Name: " + name);
      if(funktion) lines.push("  Funktion: " + funktion);
      if(phone) lines.push("  Telefon: " + phone);

      if(idx < clean.length - 1) lines.push("");
    });

    lines.push("");
  }

  function buildText(r){
    var lines = [];

    addTextBlock(lines,"Termin",r.termin,false);
    addMapBlock(lines,"Lotsenpunkt",r.lotsenpunkt);
    addMapBlock(lines,"Ausstieg",r.ausstieg);
    addTextBlock(lines,"Ablauf",r.ablauf,true);
    addMapBlock(lines,"Abfahrt",r.abfahrt);
    addListBlock(lines,"Sicherheit",r.sicherheit);
    addMapBlock(lines,"EVAK",r.evak);
    addListBlock(lines,"Sonstiges",r.sonstiges);
    addContactsBlock(lines,r.ansprechpartner);

    return lines.join("
").replace(/
{3,}/g,"

").trim();
  }

  function copyFallback(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    toast("Bericht kopiert");
  }

  function shareReport(r){
    var text = buildText(r);
    if(navigator.share){
      navigator.share({title:"Terminbericht",text:text}).catch(function(err){
        if(!err || err.name !== "AbortError") copyFallback(text);
      });
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast("Bericht kopiert – jetzt in Nachrichten-App einfügen");
      }).catch(function(){ copyFallback(text); });
    }else{
      copyFallback(text);
    }
  }

  function shareCurrent(){
    saveCurrent(true);
    var i;
    for(i=0;i<reports.length;i++){
      if(reports[i].id === currentId){ shareReport(reports[i]); return; }
    }
  }

  function toast(msg){
    var el = byId("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function(){ el.classList.remove("show"); },1600);
  }

  function bind(){
    byId("newReportTop").addEventListener("click", newReport);
    byId("newReportEmpty").addEventListener("click", newReport);
    byId("backBtn").addEventListener("click", showHome);
    byId("saveBackBtn").addEventListener("click", showHome);
    byId("deleteBtn").addEventListener("click", deleteCurrent);
    byId("shareBtn").addEventListener("click", shareCurrent);

    byId("addSecurity").addEventListener("click", function(){ addListRow("securityList",""); queueSave(); });
    byId("addOther").addEventListener("click", function(){ addListRow("otherList",""); queueSave(); });
    byId("addContact").addEventListener("click", function(){ addContactRow("","",""); queueSave(); });

    byId("termin").addEventListener("input",queueSave);
    byId("ablauf").addEventListener("input",queueSave);
